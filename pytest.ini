[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# xfail_strict: an expected failure that starts PASSING is itself a failure.
# That is deliberate. tests/test_defect_regressions.py marks open defect 17
# xfail; when someone fixes the makeup-water analysis the suite will go red
# with XPASS, which is the prompt to close the defect in the register rather
# than leave a fixed fault marked open.
xfail_strict = true
